name: Discover DSH Topic plugins

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: topic-plugin-sync
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Continue the rolling automation branch
        run: |
          branch="automation/topic-sync"
          if git fetch origin "$branch:refs/remotes/origin/$branch"; then
            git switch --force-create "$branch" "origin/$branch"
            git rebase origin/main
          else
            git switch --create "$branch"
          fi
      - name: Discover topic candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_topic_plugins.py discover
      - name: Promote maintainer-approved candidates
        run: python3 scripts/sync_topic_plugins.py render
      - name: Validate generated directory
        run: |
          python3 scripts/sync_topic_plugins.py check
          python3 scripts/validate_directory.py
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: Stop when the scan produces no changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- README.md README.zh.md data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the rolling automation branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/topic-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md data/plugins.json data/topic-candidates.json
          git commit -m "chore: refresh dsh-plugin topic candidates"
          git push --force-with-lease origin "HEAD:$branch"
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          body=$(mktemp)
          python3 scripts/sync_topic_plugins.py summary > "$body"
          cat >> "$body" <<'EOF'

          This is an automated discovery proposal. The `dsh-plugin` topic is a discovery signal, not an endorsement.

          Review `data/topic-candidates.json`. Set a candidate to `accepted` only after confirming its category and both descriptions, then run `python3 scripts/sync_topic_plugins.py render`. Merge remains a maintainer decision.
          EOF
          if [ -z "$pr_number" ]; then
            gh pr create --draft --base main --head "$branch" --title "chore: review dsh-plugin topic candidates" --body-file "$body"
          else
            gh pr edit "$pr_number" --body-file "$body"
          fi
